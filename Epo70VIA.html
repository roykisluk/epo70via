<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epomaker Split 70 — Config Tool</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --panel2:#1e222e; --line:#2a2f3d;
    --txt:#e6e9f0; --muted:#9aa3b2; --accent:#5b8cff; --accent2:#8a6cff;
    --ok:#39d98a; --warn:#ffb454; --err:#ff5f6d; --key:#272c3a; --keyhi:#3a4260;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:12px}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .pill.ok .dot{background:var(--ok)} .pill.ok{color:var(--ok);border-color:#1f5740}
  .pill.err .dot{background:var(--err)} .pill.err{color:var(--err)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:7px 14px;border-radius:8px;transition:.12s}
  button:hover{border-color:var(--accent);background:#222838}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  button.danger{border-color:#5a2530;color:var(--err)}
  button:disabled{opacity:.45;cursor:not-allowed}
  nav{display:flex;gap:4px;padding:8px 18px 0;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{border:none;border-bottom:2px solid transparent;background:none;border-radius:0;padding:9px 14px;color:var(--muted)}
  nav button.active{color:var(--txt);border-bottom-color:var(--accent)}
  nav button:hover{color:var(--txt);background:none}
  main{padding:18px;max-width:1200px;margin:0 auto}
  .panel{display:none} .panel.active{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:15px} .card h3{margin:14px 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .muted{color:var(--muted)} .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .note{background:#1a2230;border:1px solid #26415f;border-radius:8px;padding:10px 12px;color:#bcd2ff;font-size:13px}
  .note.warn{background:#2a2316;border-color:#5c4622;color:#ffd9a0}
  .note.err{background:#2a1820;border-color:#5c2630;color:#ffc2c8}
  /* keyboard render */
  #kbWrap{overflow:auto;padding:10px;background:var(--panel2);border-radius:10px;border:1px solid var(--line)}
  #kb{position:relative}
  .key{position:absolute;border:1px solid #353b4d;background:var(--key);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:2px;overflow:hidden;cursor:pointer;user-select:none;transition:.08s}
  .key:hover{border-color:var(--accent);background:#2f3650}
  .key.enc{border-color:var(--accent2);background:#2a2440}
  .key.pressed{background:var(--ok);color:#04231a;border-color:var(--ok)}
  .key small{display:block;color:var(--muted);font-size:9px}
  .key.enc small{color:#b9a8ff}
  /* picker modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
  .modal.open{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(820px,100%);padding:16px}
  .modal .cats{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}
  .modal .cats button{padding:5px 10px;font-size:12px}
  .modal .cats button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .kcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;max-height:46vh;overflow:auto;padding:4px}
  .kc{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:8px 4px;text-align:center;font-size:11px;cursor:pointer}
  .kc:hover{border-color:var(--accent);background:#222838}
  .kc small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
  input,select{font:inherit;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
  input[type=range]{padding:0}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  #log{font-family:ui-monospace,monospace;font-size:11.5px;background:#0a0c11;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:180px;overflow:auto;white-space:pre-wrap}
  .swatch{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);display:inline-block;vertical-align:middle}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <h1>Epomaker Split 70 · Config Tool</h1>
    <div class="sub">Self-hosted VIA-protocol configurator · WebHID</div>
  </div>
  <div class="spacer"></div>
  <span id="connPill" class="pill"><span class="dot"></span><span id="connTxt">Disconnected</span></span>
  <button id="connectBtn" class="primary">Connect keyboard</button>
  <button id="disconnectBtn" disabled>Disconnect</button>
</header>

<nav id="tabs"></nav>
<main id="panels"></main>

<!-- Keycode picker modal -->
<div class="modal" id="picker">
  <div class="box">
    <div class="row" style="justify-content:space-between">
      <h2 id="pickerTitle">Choose a keycode</h2>
      <button onclick="Picker.close()">Close ✕</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="pickerSearch" placeholder="Search keycodes…" style="flex:1">
      <label class="fld" style="flex-direction:row;align-items:center">Raw hex
        <input id="pickerHex" placeholder="0x041C" style="width:90px">
        <button onclick="Picker.applyHex()">Set</button>
      </label>
    </div>
    <div class="cats" id="pickerCats"></div>
    <div class="kcgrid" id="pickerGrid"></div>
  </div>
</div>

/* ============================================================
   KEYCODES MODULE  — encode/decode 16-bit QMK keycodes.
   Range bases verified against QMK data/constants/keycodes.
   ============================================================ */
const Keycodes = (() => {
  const byCode = new Map(), byName = new Map();
  const add = (code,name,label,cat,extra={}) => {
    const r = Object.assign({code,name,label,cat}, extra);
    if(!byCode.has(code)) byCode.set(code,r);
    byName.set(name,r); return r;
  };
  for (const [c,n,l,cat] of BASIC_KEYCODES) add(c,n,l,cat);
  // Auto Shift (0x7C10–0x7C15). Only act if firmware has AUTO_SHIFT_ENABLE.
  [["AS_DOWN","AS Down",0x7C10],["AS_UP","AS Up",0x7C11],["AS_RPT","AS Report",0x7C12],
   ["AS_ON","AS On",0x7C13],["AS_OFF","AS Off",0x7C14],["AS_TOGG","AS Toggle",0x7C15]]
   .forEach(([n,l,c])=>add(c,n,l,"Auto Shift"));
  // Custom keycodes: customKeycodes[i] => 0x7E00+i (QK_KB_0)
  const custom = (KEYBOARD_DEF.customKeycodes||[]).map((ck,i)=>
    add(0x7E00+i, ck.name, ck.shortName||ck.name, "Custom", {title:ck.title}));

  const RANGE = {LT:0x4000,LM:0x5000,TO:0x5200,MO:0x5220,DF:0x5240,TG:0x5260,
                 OSL:0x5280,OSM:0x52A0,TT:0x52C0,MT:0x2000,MODS:0x0100};
  const MODBITS = [["C",0x01],["S",0x02],["A",0x04],["G",0x08]]; // |0x10 => right side
  const hex = c => "0x"+c.toString(16).toUpperCase().padStart(4,"0");
  function modName(bits){
    const right = bits & 0x10; const lo = bits & 0x0F;
    const names = MODBITS.filter(([_,b])=>lo&b).map(([n])=>n).join("");
    return (right?"R":"L") + (names||"?");
  }
  // layer ops: code = base|layer  (mask 0x1F, no hidden bits)
  const layerCode = (op,layer)=> RANGE[op] | (layer & 0x1F);

  function decode(kc){
    kc &= 0xFFFF;
    if (byCode.has(kc)) return byCode.get(kc);
    const between=(a,b)=>kc>=a&&kc<=b;
    if (between(0x5220,0x523F)) return {code:kc,name:"MO",label:`MO(${kc-0x5220})`,cat:"Layers"};
    if (between(0x5200,0x521F)) return {code:kc,name:"TO",label:`TO(${kc-0x5200})`,cat:"Layers"};
    if (between(0x5240,0x525F)) return {code:kc,name:"DF",label:`DF(${kc-0x5240})`,cat:"Layers"};
    if (between(0x5260,0x527F)) return {code:kc,name:"TG",label:`TG(${kc-0x5260})`,cat:"Layers"};
    if (between(0x5280,0x529F)) return {code:kc,name:"OSL",label:`OSL(${kc-0x5280})`,cat:"Layers"};
    if (between(0x52C0,0x52DF)) return {code:kc,name:"TT",label:`TT(${kc-0x52C0})`,cat:"Layers"};
    if (between(0x52A0,0x52BF)) return {code:kc,name:"OSM",label:`OSM(${modName(kc-0x52A0)})`,cat:"Modifiers"};
    if (between(0x4000,0x4FFF)){const layer=(kc>>8)&0xF,t=kc&0xFF,tk=byCode.get(t);
      return {code:kc,name:"LT",label:`LT${layer}(${tk?tk.label:hex(t)})`,cat:"Layers"};}
    if (between(0x2000,0x3FFF)){const m=(kc>>8)&0x1F,t=kc&0xFF,tk=byCode.get(t);
      return {code:kc,name:"MT",label:`${modName(m)}_T(${tk?tk.label:hex(t)})`,cat:"Modifiers"};}
    if (between(0x0100,0x1FFF)){const m=(kc>>8)&0x1F,b=kc&0xFF,bk=byCode.get(b);
      return {code:kc,name:"MODS",label:`${modName(m)}(${bk?bk.label:hex(b)})`,cat:"Modifiers"};}
    if (between(0x7700,0x77FF)) return {code:kc,name:`M${kc-0x7700}`,label:`M${kc-0x7700}`,cat:"Macro"};
    return {code:kc,name:hex(kc),label:hex(kc),cat:"Other",unknown:true};
  }
  return {byCode,byName,custom,decode,layerCode,hex,RANGE,
          basic:BASIC_KEYCODES.map(([c,n,l,cat])=>({code:c,name:n,label:l,cat}))};
})();

const MacroKC = {
  nameToCode(n){ const e = Keycodes.byName.get(n); return e ? e.code : null; },
  codeToName(c){ const e = Keycodes.byCode.get(c); return e ? e.name : null; },

/* macros.js — VIA dynamic-macro encode/decode (PURE logic, no browser globals).
   Injected into index.template.html at the __MACROS__ marker; also require()-able by
   Node tests. Sourced from QMK master (quantum/dynamic_keymap.c, quantum/send_string/*):
     - Buffer = all macros concatenated, each terminated by a null byte 0x00. Macro `id`
       is found by skipping `id` nulls. The whole buffer MUST end in 0x00 (firmware ignores
       a buffer whose last byte != 0, treating it as an aborted write).
     - SS_QMK_PREFIX 0x01, then TAP 0x01 / DOWN 0x02 / UP 0x03 (each + one keycode byte),
       or DELAY 0x04 + ascii-decimal-ms + '|' (0x7C).
     - Plain ASCII via send_string LUT; '\n'(0x0A)=Enter, '\t'(0x09)=Tab.
   Editor text model: literal printable text + real newlines (=> Enter); LaTeX-safe [[...]]
   tokens: [[ENTER]] [[TAB]] [[DELAY:<ms>]] [[TAP:<KC>]] [[DOWN:<KC>]] [[UP:<KC>]].
   A [[word]]/[[word:arg]]-shaped sequence whose word isn't a known command is an ERROR
   (likely a typo); any other text (incl. {} and stray brackets) stays literal.
   kc adapter (injected): { nameToCode(name)->int|null, codeToName(code)->string|null }. */
const Macros = (() => {
  const PREFIX = 0x01, SUB = { TAP: 0x01, DOWN: 0x02, UP: 0x03 }, DELAY = 0x04;
  const PIPE = 0x7c, NUL = 0x00;

  function pushChar(out, code) {
    if (code === 0x0d) return;                 // strip CR (textarea CRLF)
    if (code === 0x0a || code === 0x09) { out.push(code); return; } // Enter / Tab
    if (code < 0x20 || code > 0x7e) throw new Error(`unsupported character (0x${code.toString(16)})`);
    out.push(code);
  }
  function pushLiteral(out, s) { for (let i = 0; i < s.length; i++) pushChar(out, s.charCodeAt(i)); }

  const KNOWN = new Set(["ENTER", "TAB", "DELAY", "TAP", "DOWN", "UP"]);
  const TOKEN_RE = /\[\[([A-Za-z]+)(?::([^\]]*))?\]\]/g;

  function emitToken(out, word, arg, kc) {
    const W = word.toUpperCase();
    if (!KNOWN.has(W)) throw new Error(`unknown token [[${word}]]`);
    if (W === "ENTER") { out.push(0x0a); return; }
    if (W === "TAB") { out.push(0x09); return; }
    if (W === "DELAY") {
      if (!/^\d+$/.test(arg || "")) throw new Error(`[[DELAY:n]] needs a number`);
      out.push(PREFIX, DELAY);
      for (const d of String(parseInt(arg, 10))) out.push(d.charCodeAt(0));
      out.push(PIPE);
      return;
    }
    // TAP / DOWN / UP
    const code = kc && kc.nameToCode ? kc.nameToCode(arg || "") : null;
    if (code == null) throw new Error(`[[${W}:${arg}]] — unknown keycode`);
    if (code > 0xff) throw new Error(`[[${W}:${arg}]] — only basic keycodes (<=0xFF) allowed`);
    out.push(PREFIX, SUB[W], code);
  }

  function encodeMacro(text, kc) {
    text = String(text);
    const out = [];
    let last = 0, m;
    TOKEN_RE.lastIndex = 0;
    while ((m = TOKEN_RE.exec(text)) !== null) {
      pushLiteral(out, text.slice(last, m.index));
      emitToken(out, m[1], m[2], kc);
      last = m.index + m[0].length;
    }
    pushLiteral(out, text.slice(last));
    return Uint8Array.from(out);
  }

  function decodeMacro(bytes, kc) {
    let s = "";
    const n = bytes.length;
    for (let i = 0; i < n;) {
      const b = bytes[i];
      if (b === PREFIX && i + 1 < n) {
        const sub = bytes[i + 1];
        if (sub === DELAY) {
          let j = i + 2, num = "";
          while (j < n && bytes[j] >= 0x30 && bytes[j] <= 0x39) { num += String.fromCharCode(bytes[j]); j++; }
          if (j < n && bytes[j] === PIPE) j++;
          s += `[[DELAY:${num || "0"}]]`; i = j; continue;
        }
        const name = Object.keys(SUB).find(k => SUB[k] === sub);
        if (name && i + 2 < n) {
          const code = bytes[i + 2];
          const kn = (kc && kc.codeToName ? kc.codeToName(code) : null)
            || ("0x" + code.toString(16).toUpperCase());
          s += `[[${name}:${kn}]]`; i += 3; continue;
        }
      }
      if (b === 0x0a) { s += "\n"; i++; continue; }
      if (b === 0x09) { s += "[[TAB]]"; i++; continue; }
      s += String.fromCharCode(b); i++;
    }
    return s;
  }

  function bytesUsed(texts, kc) {
    return texts.reduce((sum, t) => sum + encodeMacro(t, kc).length + 1, 0);
  }

  function serializeBuffer(texts, bufferSize, kc) {
    const parts = texts.map(t => encodeMacro(t, kc));
    const used = parts.reduce((s, e) => s + e.length + 1, 0);
    if (used > bufferSize) throw new Error(`macros exceed buffer (${used}/${bufferSize} bytes)`);
    const buf = new Uint8Array(bufferSize); // zero-filled => trailing NULs; buffer ends in 0x00
    let off = 0;
    for (const e of parts) { buf.set(e, off); off += e.length; buf[off] = NUL; off++; }
    return buf;
  }

  function parseBuffer(bytes, count, kc) {
    const texts = [];
    let start = 0;
    for (let i = 0; i < bytes.length && texts.length < count; i++) {
      if (bytes[i] === NUL) { texts.push(decodeMacro(bytes.subarray(start, i), kc)); start = i + 1; }
    }
    while (texts.length < count) texts.push("");
    return texts;
  }

  function validate(text, kc) {
    try { encodeMacro(text, kc); return { ok: true }; }
    catch (e) { return { ok: false, error: e.message }; }
  }

  return { encodeMacro, decodeMacro, parseBuffer, serializeBuffer, bytesUsed, validate };
})();
if (typeof module !== "undefined" && module.exports) module.exports = Macros;


/* ============================================================
   VIA PROTOCOL  — typed commands over WebHID (report id 0, 32B).
   Command IDs verified against the-via/qmk_firmware quantum/via.h.
   ============================================================ */
const VIA_CMD = {
  GET_PROTOCOL_VERSION:0x01, GET_KEYBOARD_VALUE:0x02, SET_KEYBOARD_VALUE:0x03,
  GET_KEYCODE:0x04, SET_KEYCODE:0x05, KEYMAP_RESET:0x06,
  CUSTOM_SET:0x07, CUSTOM_GET:0x08, CUSTOM_SAVE:0x09,
  EEPROM_RESET:0x0A, BOOTLOADER_JUMP:0x0B,
  MACRO_GET_COUNT:0x0C, MACRO_GET_BUFFER_SIZE:0x0D, MACRO_GET_BUFFER:0x0E,
  MACRO_SET_BUFFER:0x0F, MACRO_RESET:0x10,
  GET_LAYER_COUNT:0x11, GET_BUFFER:0x12, SET_BUFFER:0x13,
  GET_ENCODER:0x14, SET_ENCODER:0x15,
};
const KB_VALUE = {UPTIME:0x01, LAYOUT_OPTIONS:0x02, SWITCH_MATRIX_STATE:0x03,
                  FIRMWARE_VERSION:0x04};

class Via {
  constructor(device){
    this.dev = device;
    this._pending = null;
    this._gen = 0;
    this._lock = Promise.resolve();
    // Match each input report to the command we sent: VIA echoes the command id in
    // byte 0 (and the sub-command in byte 1 for get/set_keyboard_value). Reports that
    // don't match (stray/late responses, OS-delivered key events) are ignored, so a
    // timed-out command can never desync the next one. Critical: reloadKeymap issues
    // ~50 sequential reads; one desync = silent keymap corruption.
    this._onInput = (e)=>{
      const d = new Uint8Array(e.data.buffer, e.data.byteOffset, e.data.byteLength);
      const p = this._pending; if(!p) return;
      if(d[0] !== p.expect) return;
      if(p.expect2 != null && d[1] !== p.expect2) return;
      this._pending = null; clearTimeout(p.t); p.resolve(d);
    };
    device.addEventListener("inputreport", this._onInput);
  }
  _raw(bytes){
    const out = new Uint8Array(32);
    out.set(bytes.slice(0,32));
    const expect = bytes[0];
    const expect2 = (bytes[0]===VIA_CMD.GET_KEYBOARD_VALUE || bytes[0]===VIA_CMD.SET_KEYBOARD_VALUE) ? bytes[1] : null;
    return new Promise((resolve,reject)=>{
      const gen = ++this._gen;
      const t = setTimeout(()=>{ if(this._pending&&this._pending.gen===gen) this._pending=null;
        reject(new Error("VIA timeout — no HID response")); }, 1500);
      this._pending = {gen, expect, expect2, resolve, t};
      this.dev.sendReport(0, out).catch(e=>{ clearTimeout(t);
        if(this._pending&&this._pending.gen===gen) this._pending=null; reject(e); });
    });
  }
  // serialize commands (one outstanding request at a time)
  exec(bytes){ const run=()=>this._raw(bytes); const p=this._lock.then(run,run); this._lock=p.catch(()=>{}); return p; }

  async getProtocolVersion(){ const r=await this.exec([VIA_CMD.GET_PROTOCOL_VERSION]); return (r[1]<<8)|r[2]; }
  async getLayerCount(){ const r=await this.exec([VIA_CMD.GET_LAYER_COUNT]); return r[1]; }
  async getFirmwareVersion(){ const r=await this.exec([VIA_CMD.GET_KEYBOARD_VALUE,KB_VALUE.FIRMWARE_VERSION]);
    return (r[2]<<24)|(r[3]<<16)|(r[4]<<8)|r[5]; }
  async setKeycode(layer,row,col,kc){ await this.exec([VIA_CMD.SET_KEYCODE,layer,row,col,(kc>>8)&0xFF,kc&0xFF]); }
  async getEncoder(layer,idx,cw){ const r=await this.exec([VIA_CMD.GET_ENCODER,layer,idx,cw?1:0]); return (r[4]<<8)|r[5]; }
  async setEncoder(layer,idx,cw,kc){ await this.exec([VIA_CMD.SET_ENCODER,layer,idx,cw?1:0,(kc>>8)&0xFF,kc&0xFF]); }
  async eepromReset(){ await this.exec([VIA_CMD.EEPROM_RESET]); }
  // dynamic keymap buffer (layer-major: ((layer*rows+row)*cols+col)*2)
  async getKeymapBuffer(totalBytes){
    const buf = new Uint8Array(totalBytes); const CHUNK=28;
    for(let off=0; off<totalBytes; off+=CHUNK){
      const sz=Math.min(CHUNK,totalBytes-off);
      const r=await this.exec([VIA_CMD.GET_BUFFER,(off>>8)&0xFF,off&0xFF,sz]);
      for(let i=0;i<sz;i++) buf[off+i]=r[4+i];
    }
    return buf;
  }
  // ---- dynamic macros (VIA 0x0C–0x10). Buffer = macros concatenated, each NUL-terminated;
  //      whole buffer must end in 0x00. Get/set chunk in ≤28-byte windows like the keymap buffer.
  async getMacroCount(){ const r=await this.exec([VIA_CMD.MACRO_GET_COUNT]); return r[1]; }
  async getMacroBufferSize(){ const r=await this.exec([VIA_CMD.MACRO_GET_BUFFER_SIZE]); return (r[1]<<8)|r[2]; }
  async getMacroBuffer(totalBytes){
    const buf=new Uint8Array(totalBytes); const CHUNK=28;
    for(let off=0; off<totalBytes; off+=CHUNK){
      const sz=Math.min(CHUNK,totalBytes-off);
      const r=await this.exec([VIA_CMD.MACRO_GET_BUFFER,(off>>8)&0xFF,off&0xFF,sz]);
      for(let i=0;i<sz;i++) buf[off+i]=r[4+i];
    }
    return buf;
  }
  async setMacroBuffer(offset, bytes){
    const CHUNK=28;
    for(let i=0;i<bytes.length;i+=CHUNK){
      const chunk=Array.from(bytes.slice(i,i+CHUNK)); const off=offset+i;
      await this.exec([VIA_CMD.MACRO_SET_BUFFER,(off>>8)&0xFF,off&0xFF,chunk.length,...chunk]);
    }
  }
  async resetMacros(){ await this.exec([VIA_CMD.MACRO_RESET]); }
  // matrix state: per row 2 bytes (cols 9>8): [ (v>>8)&0xFF, v&0xFF ]
  async getMatrixState(rows,cols){
    const r=await this.exec([VIA_CMD.GET_KEYBOARD_VALUE,KB_VALUE.SWITCH_MATRIX_STATE]);
    const bpr = Math.ceil(cols/8); const state=[];
    for(let row=0; row<rows; row++){
      let v=0; const base=2+row*bpr;
      for(let b=0;b<bpr;b++) v = (v<<8) | r[base+b]; // big-endian per row
      const cells=[]; for(let c=0;c<cols;c++) cells.push((v>>c)&1);
      state.push(cells);
    }
    return state;
  }
  // custom (lighting) channel protocol
  async customGet(channel,value,len=1){ const r=await this.exec([VIA_CMD.CUSTOM_GET,channel,value]); return Array.from(r.slice(3,3+len)); }
  async customSet(channel,value,data){ await this.exec([VIA_CMD.CUSTOM_SET,channel,value,...data]); }
  async customSave(channel){ await this.exec([VIA_CMD.CUSTOM_SAVE,channel]); }

  dispose(){ try{this.dev.removeEventListener("inputreport",this._onInput);}catch(e){} }
}

/* ---- parse KLE layout from definition ---- */
function parseLayout(def){
  const kle = def.layouts.keymap; const keys=[]; const encoders=[];
  let y=0;
  for(const rowArr of kle){
    let x=0, w=1, h=1;
    for(const item of rowArr){
      if(typeof item==="object"){
        if("x" in item) x+=item.x;
        if("y" in item) y+=item.y;
        if("w" in item) w=item.w;
        if("h" in item) h=item.h;
        continue;
      }
      const segs = String(item).split("\n");
      const pos = segs[0];
      const m = pos.match(/^(\d+),(\d+)$/);
      const encSeg = segs.find(s=>/^e\d+$/.test(s));
      const enc = encSeg ? parseInt(encSeg.slice(1),10) : null;
      if(m){
        const row=+m[1], col=+m[2];
        const k={x,y,w,h,pos,row,col,enc};
        keys.push(k);
        if(enc!=null) encoders.push({idx:enc,row,col});
      }
      x += w; w=1; h=1;
    }
    y += 1;
  }
  encoders.sort((a,b)=>a.idx-b.idx);
  return {keys, encoders};
}

/* ============================================================
   KEYCODE PICKER  (shared modal)
   ============================================================ */
const Picker = {
  _cb:null, _cat:"Basic", _q:"",
  catsOrder:["Basic","Modifiers","Layers","Auto Shift","Media","Mouse","System","Custom","Macro","Special","All"],
  open(title, cb){
    this._cb=cb; document.getElementById("pickerTitle").textContent=title||"Choose a keycode";
    document.getElementById("pickerHex").value="";
    document.getElementById("pickerSearch").value=""; this._q="";
    document.getElementById("picker").classList.add("open");
    this._renderCats(); this._renderGrid();
    document.getElementById("pickerSearch").focus();
  },
  close(){ document.getElementById("picker").classList.remove("open"); this._cb=null; },
  pick(code){ const cb=this._cb; this.close(); if(cb) cb(code); },
  applyHex(){ const v=parseInt(document.getElementById("pickerHex").value,16);
    if(isNaN(v)||v<0||v>0xFFFF){ alert("Enter a hex value 0x0000–0xFFFF"); return; } this.pick(v); },
  _entries(){
    // build full entry list including computed layer-ops
    const out = Keycodes.basic.slice();
    Keycodes.custom.forEach(c=>out.push(c));
    [["AS_DOWN",0x7C10],["AS_UP",0x7C11],["AS_RPT",0x7C12],["AS_ON",0x7C13],["AS_OFF",0x7C14],["AS_TOGG",0x7C15]]
      .forEach(([n,c])=>out.push(Keycodes.byCode.get(c)));
    const L = Math.max(App.layerCount||4, 1);
    for(const op of ["MO","TO","TG","DF","OSL","TT"]){
      for(let i=0;i<L;i++) out.push({code:Keycodes.layerCode(op,i),name:`${op}(${i})`,label:`${op}(${i})`,cat:"Layers"});
    }
    const M = App.macroCount||0;
    for(let i=0;i<M;i++) out.push({code:0x7700+i,name:`M${i}`,label:`M${i}`,cat:"Macro"});
    return out;
  },
  _renderCats(){
    const present=new Set(this._entries().map(e=>e.cat)); present.add("All");
    const host=document.getElementById("pickerCats"); host.innerHTML="";
    for(const c of this.catsOrder){ if(!present.has(c))continue;
      const b=document.createElement("button"); b.textContent=c;
      if(c===this._cat)b.className="active";
      b.onclick=()=>{this._cat=c;this._renderCats();this._renderGrid();};
      host.appendChild(b);
    }
  },
  _renderGrid(){
    const grid=document.getElementById("pickerGrid"); grid.innerHTML="";
    const q=this._q.toLowerCase();
    let list=this._entries();
    if(this._cat!=="All") list=list.filter(e=>e.cat===this._cat);
    if(q) list=list.filter(e=>(e.name+" "+e.label).toLowerCase().includes(q));
    for(const e of list){
      const d=document.createElement("div"); d.className="kc"; d.title=e.name+(e.title?` — ${e.title}`:"");
      d.innerHTML=`${escapeHtml(e.label)}<small>${escapeHtml(e.name)}</small>`;
      d.onclick=()=>this.pick(e.code);
      grid.appendChild(d);
    }
    if(!list.length) grid.innerHTML='<div class="muted" style="padding:10px">No matches.</div>';
  }
};
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---- shared keyboard renderer ---- */
const KEY_UNIT = 46, KEY_GAP = 3;
function renderBoard(host, opts){
  opts = opts || {};
  let maxX=0, maxY=0;
  App.layout.forEach(k=>{ maxX=Math.max(maxX,k.x+k.w); maxY=Math.max(maxY,k.y+k.h); });
  host.style.position="relative";
  host.style.width=(maxX*KEY_UNIT)+"px";
  host.style.height=(maxY*KEY_UNIT)+"px";
  host.innerHTML="";
  for(const k of App.layout){
    const el=document.createElement("div");
    el.className="key"+(k.enc!=null?" enc":"");
    const extra=opts.classFor&&opts.classFor(k); if(extra) el.className+=" "+extra;
    el.style.left=(k.x*KEY_UNIT)+"px"; el.style.top=(k.y*KEY_UNIT)+"px";
    el.style.width=(k.w*KEY_UNIT-KEY_GAP)+"px"; el.style.height=(k.h*KEY_UNIT-KEY_GAP)+"px";
    const lab=opts.label?opts.label(k):{main:k.pos};
    el.innerHTML=`<span>${escapeHtml(lab.main||"")}</span>${lab.sub?`<small>${escapeHtml(lab.sub)}</small>`:""}`;
    el.dataset.row=k.row; el.dataset.col=k.col;
    if(opts.onClick) el.onclick=()=>opts.onClick(k,el);
    host.appendChild(el);
  }
}
function needConnection(){ if(!App.connected){ alert("Connect the keyboard first (top-right button)."); return false;} return true; }

/* ---- GUI layer view -------------------------------------------------------
   This board's firmware has 4 layers (0..3). The user only works with two:
   their base content lives on firmware layer 2 (the layer the keyboard boots /
   reverts to), and the numpad on firmware layer 3.
   Why the numpad is on 3, not 1: QMK resolves a key by scanning ACTIVE layers
   top-down and taking the first non-transparent code. A momentary layer only
   "wins" if its index is ABOVE the base. Base is 2, so the numpad must be 3 —
   on 1 it would sit below the base and stay hidden.
   We relabel + hide the rest in the GUI ONLY. VIA has no command to move layers
   or set the default layer, so this is display-only — it does NOT change what
   the keyboard boots into. Edit this one table to change the mapping.        */
const LAYER_VIEW = [
  { label:"0", fw:2 },   // shown as "Layer 0"  -> firmware layer 2 (base)
  { label:"1", fw:3 },   // shown as "Layer 1"  -> firmware layer 3 (numpad; above the base)
];
const NUMPAD_FW = 3;     // firmware layer that holds the numpad (must be > base layer)
App.state.layer = LAYER_VIEW[0].fw;   // GUI opens on the base layer

// [row, col, keycode-name] — keypad codes (Num-Lock aware), placed in a
// standard numpad layout: 7-8-9 on the TOP row, 1-2-3 on the BOTTOM row, 0/.
// below. NOTE: on this board the matrix-row numbering runs OPPOSITE to physical
// top→bottom within a hand's 3×3 block — the *higher*-numbered digit row sits
// physically on top (confirmed on hardware: writing 1-2-3 to row 8 put them on
// the top row). So for a normal numpad, 7-8-9 goes on the higher row number.
// Right hand: digit rows 6/7/8 (8=top), 0/. on row 9 (bottom). Verified.
// Left hand: digit rows 1/2/3 (3=top), 0/. on row 4 — same convention assumed
// (left half not used by the ③ Numpad button; mirror of the verified right).
const NUMPAD = {
  right:[
    [8,2,"KC_KP_7"],[8,3,"KC_KP_8"],[8,4,"KC_KP_9"],
    [7,2,"KC_KP_4"],[7,3,"KC_KP_5"],[7,4,"KC_KP_6"],
    [6,2,"KC_KP_1"],[6,3,"KC_KP_2"],[6,4,"KC_KP_3"],
    [9,3,"KC_KP_0"],[9,4,"KC_KP_DOT"],
  ],
  left:[
    [3,4,"KC_KP_7"],[3,5,"KC_KP_8"],[3,6,"KC_KP_9"],
    [2,4,"KC_KP_4"],[2,5,"KC_KP_5"],[2,6,"KC_KP_6"],
    [1,4,"KC_KP_1"],[1,5,"KC_KP_2"],[1,6,"KC_KP_3"],
    [4,3,"KC_KP_0"],[4,2,"KC_KP_DOT"],
  ],
};

registerPanel({
  id:"diag", title:"① Diagnostic", requiresConnection:false,
  render(root){
    root.innerHTML=`
      <div class="card">
        <h2>Connection diagnostic</h2>
        <p class="muted">If VIA / caniusevia.com can't see your keyboard, there are two very different causes — and only one is fixable by any browser tool. This check tells you which one you're in.</p>
        <div class="row"><button id="diagScan" class="primary">Inspect HID interfaces…</button>
          <button id="diagGranted">List already-allowed devices</button></div>
        <div id="diagOut" style="margin-top:12px"></div>
      </div>
      <div class="card">
        <h3>What this means</h3>
        <table>
          <tr><th>Result</th><th>Meaning</th><th>Fix</th></tr>
          <tr><td class="ok">FF60 interface found</td><td>Your firmware exposes the VIA raw-HID interface. caniusevia.com only rejected it because your VID/PID isn't in its registry.</td><td>Use the <b>Connect keyboard</b> button — this tool ships your JSON, so it works.</td></tr>
          <tr><td class="err">No FF60 interface</td><td>This firmware does <b>not</b> expose VIA. No web tool (this one included) can configure it.</td><td>Flash VIA-compatible QMK firmware, then return here.</td></tr>
        </table>
      </div>
      <div class="card"><h3>Session log</h3><div id="log"></div></div>`;
    const out=root.querySelector("#diagOut");
    const inspect=(devs)=>{
      if(!devs.length){ out.innerHTML='<div class="note warn">No device selected.</div>'; return; }
      let html="", anyVia=false;
      for(const d of devs){
        let rows="";
        for(const c of d.collections){
          const via=(c.usagePage===0xFF60);
          if(via) anyVia=true;
          rows+=`<tr><td class="mono">${hex16(c.usagePage)}</td><td class="mono">${hex16(c.usage)}</td><td>${via?'<span class="ok">◀ VIA raw-HID</span>':''}</td></tr>`;
        }
        html+=`<div style="margin-bottom:10px"><b>${escapeHtml(d.productName||"(unnamed)")}</b>
          <span class="muted mono">VID ${hex16(d.vendorId)} PID ${hex16(d.productId)}</span>
          <table style="margin-top:6px"><tr><th>Usage Page</th><th>Usage</th><th></th></tr>${rows}</table></div>`;
      }
      const verdict=anyVia
        ? '<div class="note"><b class="ok">✓ VIA interface present.</b> Click <b>Connect keyboard</b> at the top — this tool will configure it.</div>'
        : '<div class="note err"><b>✗ No 0xFF60 / usage 0x61 interface found.</b> This firmware does not expose VIA. No browser tool can configure it; you would need to flash VIA-compatible firmware.</div>';
      out.innerHTML=verdict+html;
    };
    root.querySelector("#diagScan").onclick=async()=>{
      if(!("hid" in navigator)){ out.innerHTML='<div class="note err">WebHID unavailable. Use Chrome/Edge/Brave/Opera.</div>'; return; }
      try{ const devs=await navigator.hid.requestDevice({filters:[]});
        log(`Inspected ${devs.length} selected device(s).`); inspect(devs);
      }catch(e){ out.innerHTML=`<div class="note err">${escapeHtml(e.message)}</div>`; }
    };
    root.querySelector("#diagGranted").onclick=async()=>{
      const devs=await navigator.hid.getDevices(); inspect(devs);
    };
  }
});

      if(!App.encoders.length){ card.style.display="none"; return; }
      if(!App.connected){ host.innerHTML='<span class="muted">Connect to view/edit encoder rotation.</span>'; return; }
      host.innerHTML="";
      for(const enc of App.encoders){
        let cw=0,ccw=0;
        try{ cw=await App.via.getEncoder(App.state.layer,enc.idx,true);
             ccw=await App.via.getEncoder(App.state.layer,enc.idx,false); }catch(e){}

        wrap.innerHTML=`<b>Encoder ${enc.idx}</b> <span class="muted mono">(${enc.row},${enc.col})</span> L${App.state.layer}`;
        const mk=(dir,code)=>{ const b=document.createElement("button");

              catch(e){ log("Encoder set failed: "+e.message,"err"); }
            }); };
          return b; };
        wrap.appendChild(mk(false,ccw)); wrap.appendChild(mk(true,cw));
        host.appendChild(wrap);
      }
    };

    drawLayers(); draw(); drawEncoders();
    App.on("keymap-loaded",()=>{drawLayers();draw();drawEncoders();});
    App.on("connect",()=>{drawLayers();draw();drawEncoders();});
    App.on("disconnect",()=>{draw();drawEncoders();});

  }
});

/* ============================================================
   3. NUMPAD  — one button: writes the right-hand numpad to the
   numpad layer and binds the corner key (left of L-Ctrl) to a
   momentary switch to it, on every layer so it always works.
   ============================================================ */
registerPanel({
  id:"presets", title:"③ Numpad", requiresConnection:true,
  render(root){
    root.innerHTML=`
      <div class="card">
        <h2>Numpad + momentary key</h2>
        <p class="muted">One click sets everything up: writes a Num-Lock-aware keypad
          (<code>KC_KP_*</code>) onto the <b>right half</b> of <b>Layer&nbsp;1</b>, and binds the
          corner key <b>left of left-Ctrl</b> (matrix <span class="mono">4,0</span>) to a
          <b>momentary switch</b> to it on every layer. <b>Hold</b> it for the numpad,
          <b>release</b> to return to your base layer (Layer&nbsp;0). Layer&nbsp;1 sits just above
          your base so the held layer actually wins. Only those keys change; everything else is
          left untouched and saved to the keyboard immediately.</p>
        <button id="npGo" class="primary">Set up numpad + momentary key</button>
        <div id="npOut" class="muted" style="margin-top:12px"></div>
      </div>`;
    const exists=(r,c)=> App.layout.some(k=>k.row===r&&k.col===c);
    const posLabel=(r,c)=>{ const k=App.layout.find(k=>k.row===r&&k.col===c); return k?k.pos:`${r},${c}`; };
    root.querySelector("#npGo").onclick=async()=>{
      if(!needConnection())return;
      const out=root.querySelector("#npOut");
      if(NUMPAD_FW>=(App.layerCount||0)){
        out.innerHTML=`<span class="err">This keyboard reports only ${App.layerCount} layer(s), but the numpad needs firmware layer ${NUMPAD_FW} (it must sit above your base). Aborting — adjust LAYER_VIEW/NUMPAD_FW.</span>`;
        return;
      }
      let ok=0, skip=0;
      // 1) numpad on the right half of the numpad layer (firmware NUMPAD_FW)
      for(const [r,c,n] of NUMPAD.right){ const rec=Keycodes.byName.get(n);
        if(!rec||!exists(r,c)){ skip++; continue; }
        try{ await App.via.setKeycode(NUMPAD_FW,r,c,rec.code); App.keymap[App.kmIndex(NUMPAD_FW,r,c)]=rec.code; ok++; }
        catch(e){ skip++; }
      }
      // 2) momentary MO(numpad) on the corner key (4,0) of EVERY firmware layer,
      //    so it works no matter which layer is the active base. (4,0) is never a
      //    numpad digit, and MO on the numpad layer itself is a harmless no-op.
      const MOM_R=4, MOM_C=0, mo=Keycodes.layerCode("MO",NUMPAD_FW);
      let mok=0;
      if(exists(MOM_R,MOM_C)){
        for(let l=0;l<(App.layerCount||1);l++){
          try{ await App.via.setKeycode(l,MOM_R,MOM_C,mo); App.keymap[App.kmIndex(l,MOM_R,MOM_C)]=mo; mok++; }
          catch(e){ skip++; }
        }
      } else { skip++; }
      out.innerHTML=`<span class="ok">Done — ${ok} numpad keys on Layer 1; momentary ${escapeHtml(Keycodes.decode(mo).label)} on ${posLabel(MOM_R,MOM_C)} across ${mok} layer(s)${skip?`; ${skip} skipped`:""}.</span>`;
      log(`Numpad setup: ${ok} keys + ${Keycodes.decode(mo).label} on (4,0)x${mok} layers${skip?`, ${skip} skipped`:""}.`,"ok");
      App.emit("keymap-loaded");
    };
  }
});

/* ============================================================
   6. IMPORT / EXPORT  — VIA-style keymap JSON + reset to defaults.
   ============================================================ */
function kcToken(code){
  const d=Keycodes.decode(code);
  if(d.unknown) return Keycodes.hex(code);
  if(["MO","TO","TG","DF","OSL","TT"].includes(d.name)) return d.label; // e.g. MO(2)
  if(["MODS","MT","OSM","LT"].includes(d.name)) return Keycodes.hex(code); // complex → hex (round-trips)
  return d.name; // KC_A, AS_TOGG, MOR_1, …
}
function tokenToKc(tok){
  tok=String(tok).trim();
  if(/^0x[0-9a-f]+$/i.test(tok)) return parseInt(tok,16)&0xFFFF;
  const m=tok.match(/^(MO|TO|TG|DF|OSL|TT)\((\d+)\)$/);
  if(m) return Keycodes.layerCode(m[1],+m[2]);
  const r=Keycodes.byName.get(tok);
  return r?r.code:null;
}
// Shared keymap (de)serialization — used by Import/Export and Profiles.
// Uses RAW firmware layer indices (NOT LAYER_VIEW) so snapshots stay lossless.
async function buildKeymapObject(){
  const layers=[];
  for(let l=0;l<App.layerCount;l++){ const layer=[];
    for(let r=0;r<App.rows;r++)for(let c=0;c<App.cols;c++) layer.push(kcToken(App.getKC(l,r,c)));
    layers.push(layer);
  }
  const encoders=[];
  if(App.encoders.length){
    for(let l=0;l<App.layerCount;l++){ const le=[];
      for(const enc of App.encoders){
        try{ const cw=await App.via.getEncoder(l,enc.idx,true), ccw=await App.via.getEncoder(l,enc.idx,false);
          le.push([kcToken(ccw),kcToken(cw)]); }
        catch(e){ le.push(null); }
      }
      encoders.push(le);
    }
  }
  return { tool:"epo70-config", name:App.def.name,
    vendorProductId:((parseInt(App.def.vendorId,16)<<16)>>>0)|parseInt(App.def.productId,16),
    matrix:{rows:App.rows,cols:App.cols}, layerCount:App.layerCount,
    encoderCount:App.encoders.length, layers, encoders };
}
async function applyKeymapObject(data, onProgress){
  if(!data.layers || !data.matrix || data.matrix.rows!==App.rows || data.matrix.cols!==App.cols)
    throw new Error("File does not match this keyboard's matrix.");
  let written=0, skipped=0;
  const nLayers=Math.min(data.layerCount||data.layers.length, App.layerCount);
  for(let l=0;l<nLayers;l++){ let idx=0;
    for(let r=0;r<App.rows;r++)for(let c=0;c<App.cols;c++){
      const tok=data.layers[l][idx++]; const kc=tokenToKc(tok);
      if(kc==null){ skipped++; continue; }
      if(kc!==App.getKC(l,r,c)){ try{ await App.via.setKeycode(l,r,c,kc); App.keymap[App.kmIndex(l,r,c)]=kc; written++; }catch(e){ skipped++; } }
    }
    if(onProgress) onProgress(`Writing… layer ${l+1}/${nLayers}, ${written} keys`);
  }
  let encWritten=0;
  if(Array.isArray(data.encoders) && App.encoders.length){
    for(let l=0;l<Math.min(data.encoders.length,App.layerCount);l++){
      const le=data.encoders[l]||[];
      for(let ei=0; ei<App.encoders.length && ei<le.length; ei++){
        const pair=le[ei]; if(!pair) continue;
        const idx=App.encoders[ei].idx, ccw=tokenToKc(pair[0]), cw=tokenToKc(pair[1]);
        try{ if(ccw!=null){ await App.via.setEncoder(l,idx,false,ccw); encWritten++; }
             if(cw!=null){ await App.via.setEncoder(l,idx,true,cw); encWritten++; } }
        catch(e){ skipped++; }
      }
    }
  }
  App.emit("keymap-loaded");
  return {written, skipped, encWritten};
}

        <p class="muted">Saves the full keymap (all layers + encoders) to a JSON file you can back up or re-import.</p>
        <button id="exportBtn" class="primary">Export keymap to file</button>

      <div class="card">
        <h2>Import</h2>
        <p class="muted">Loads a keymap file and writes it to the keyboard. Matrix dimensions must match this keyboard.</p>
        <div class="row"><input type="file" id="importFile" accept="application/json,.json"><button id="importBtn">Import & write</button></div>
        <div id="importOut" style="margin-top:10px"></div>
      </div>
      <div class="card">
        <h2>Reset to firmware defaults</h2>
        <div class="note err">Erases all customisation stored on the keyboard (keymap, lighting) and restores the firmware's built-in defaults. <b>This also resets the default layer to 0 (Windows)</b> — afterwards you'll need <code>fn+s</code> to return to the Mac layout.</div>
        <button id="resetBtn" class="danger" style="margin-top:10px">Reset keyboard (EEPROM)</button>
      </div>`;

    root.querySelector("#exportBtn").onclick=async()=>{
      if(!App.keymap){ alert("Connect and load the keymap first."); return; }
      const obj=await buildKeymapObject();
      const blob=new Blob([JSON.stringify(obj,null,1)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download=App.def.name+"-keymap.json"; a.click(); URL.revokeObjectURL(a.href);
      log("Exported keymap.","ok");
    };

    root.querySelector("#importBtn").onclick=async()=>{
      if(!needConnection()) return;
      const f=root.querySelector("#importFile").files[0];
      const out=root.querySelector("#importOut");
      if(!f){ out.innerHTML='<span class="warn">Choose a file first.</span>'; return; }
      let data; try{ data=JSON.parse(await f.text()); }catch(e){ out.innerHTML='<span class="err">Invalid JSON.</span>'; return; }
      try{
        const res=await applyKeymapObject(data, msg=>{ out.innerHTML=`<span class="muted">${msg}</span>`; });
        out.innerHTML=`<span class="ok">Import complete: ${res.written} keys${res.encWritten?`, ${res.encWritten} encoder actions`:""} written, ${res.skipped} skipped.</span>`;
        log(`Imported keymap (${res.written} written, ${res.skipped} skipped).`,"ok");
      }catch(e){ out.innerHTML=`<span class="err">${escapeHtml(e.message)}</span>`; }
    };

    root.querySelector("#resetBtn").onclick=async()=>{
      if(!needConnection()) return;
      if(!confirm("Reset the keyboard to firmware defaults?\n\nThis erases your customisation AND resets the default layer to 0 (Windows) — you'll need fn+s to get the Mac layout back.")) return;
      try{ await App.via.eepromReset(); log("EEPROM reset sent. Reloading keymap…","warn");
        await reloadKeymap(); }
      catch(e){ log("Reset failed: "+e.message,"err"); }
    };
  }
});


/* ============================================================
   SHELL — tabs, connection lifecycle
   ============================================================ */
function buildShell(){
  const tabs=document.getElementById("tabs"), host=document.getElementById("panels");
  PANELS.forEach((p,i)=>{
    const btn=document.createElement("button"); btn.textContent=p.title; btn.dataset.id=p.id;
    btn.onclick=()=>showTab(p.id); tabs.appendChild(btn);
    const div=document.createElement("div"); div.className="panel"; div.id="panel-"+p.id; host.appendChild(div);
    try{ p.render(div, App); }catch(e){ div.innerHTML=`<div class="card err">Panel error: ${escapeHtml(e.message)}</div>`; }
  });
  if(PANELS.length) showTab(PANELS[0].id);
}
function showTab(id){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+id));
}
function setConn(on, txt){
  App.connected=on;
  const pill=document.getElementById("connPill");
  pill.className="pill "+(on?"ok":(txt==="error"?"err":""));
  document.getElementById("connTxt").textContent=txt||(on?"Connected":"Disconnected");
  document.getElementById("connectBtn").disabled=on;
  document.getElementById("disconnectBtn").disabled=!on;
}

async function connect(){
  if(!("hid" in navigator)){ alert("WebHID not available. Use Chrome, Edge, Brave or Opera (desktop)."); return; }
  try{
    const filters=[{usagePage:0xFF60, usage:0x61}];
    const devices=await navigator.hid.requestDevice({filters});
    if(!devices.length){ log("No device selected.","warn"); return; }
    const dev=devices[0];
    if(!dev.opened) await dev.open();
    App.via=new Via(dev);
    log(`Opened "${dev.productName}" (VID ${hex16(dev.vendorId)} PID ${hex16(dev.productId)})`,"ok");
    App.protocol=await App.via.getProtocolVersion();
    App.layerCount=await App.via.getLayerCount();
    log(`VIA protocol v${App.protocol}, ${App.layerCount} layers. Reading keymap…`);
    await reloadKeymap();
    setConn(true);
    App.emit("connect");
  }catch(e){
    log("Connect failed: "+e.message,"err");
    setConn(false,"error");
  }
}
async function reloadKeymap(){
  const total=App.layerCount*App.rows*App.cols*2;
  const buf=await App.via.getKeymapBuffer(total);
  const km=new Uint16Array(App.layerCount*App.rows*App.cols);
  for(let i=0;i<km.length;i++) km[i]=(buf[i*2]<<8)|buf[i*2+1];
  App.keymap=km;
  log(`Keymap loaded (${km.length} keys across ${App.layerCount} layers).`,"ok");
  App.emit("keymap-loaded");
}
function disconnect(){
  try{ App.via&&App.via.dispose(); if(App.via&&App.via.dev.opened) App.via.dev.close(); }catch(e){}
  App.via=null; App.keymap=null; setConn(false); App.emit("disconnect");
  log("Disconnected.");
}
const hex16=n=>"0x"+(n||0).toString(16).toUpperCase().padStart(4,"0");

document.getElementById("connectBtn").onclick=connect;
document.getElementById("disconnectBtn").onclick=disconnect;
if("hid" in navigator){
  navigator.hid.addEventListener("disconnect", e=>{ if(App.via&&e.device===App.via.dev) disconnect(); });
}

/* ---- in-page keycode self-test (encode↔decode round-trip) ---- */
function selfTest(){
  const checks=[];
  const t=(name,cond)=>checks.push([name,!!cond]);
  t("KC_A decodes to A", Keycodes.decode(0x04).label==="A");
  t("MO(2) round-trip", Keycodes.layerCode("MO",2)===0x5222 && Keycodes.decode(0x5222).label==="MO(2)");
  t("TO(0) round-trip", Keycodes.layerCode("TO",0)===0x5200 && Keycodes.decode(0x5200).label==="TO(0)");
  t("TG(1) round-trip", Keycodes.layerCode("TG",1)===0x5261);
  t("AS_TOGG present", Keycodes.byName.get("AS_TOGG").code===0x7C15);
  t("custom MOR_1 @0x7E03", (Keycodes.byName.get("MOR_1")||{}).code===0x7E03);
  t("LT decode", Keycodes.decode(0x4000|(1<<8)|0x2C).label.startsWith("LT1("));
  t("macro M3 decodes", Keycodes.decode(0x7703).label==="M3");
  t("macro encodes 'hi'", Array.from(Macros.encodeMacro("hi",MacroKC)).join()==="104,105");
  t("macro [[TAP:KC_LEFT]] encodes", Array.from(Macros.encodeMacro("[[TAP:KC_LEFT]]",MacroKC)).join()==="1,1,80");
  t("macro buffer round-trip", Macros.parseBuffer(Macros.serializeBuffer(["hi","x"],16,MacroKC),2,MacroKC).join("|")==="hi|x");
  const fail=checks.filter(c=>!c[1]);
  if(fail.length){ console.error("SELFTEST FAIL",fail); log("Self-test FAILED: "+fail.map(f=>f[0]).join(", "),"err"); }
  else log(`Self-test passed (${checks.length} keycode checks).`,"ok");
}

/* ---- boot ---- */
(function boot(){
  try{
    const {keys,encoders}=parseLayout(App.def);
    App.layout=keys; App.encoders=encoders;
    buildShell();
    selfTest();
    log(`Loaded definition "${App.def.name}" — ${App.rows}×${App.cols} matrix, ${keys.length} keys, ${encoders.length} encoder(s).`);
    if(!("hid" in navigator)) log("⚠ WebHID not supported in this browser. Use Chrome/Edge/Brave/Opera.","err");
  }catch(e){ document.body.innerHTML="<pre style='color:#f88;padding:20px'>Boot error: "+e.stack+"</pre>"; }
})();
</script>
